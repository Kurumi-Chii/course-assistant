<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>课程助手模拟页</title>
<style>body{font:20px system-ui;padding:28px}button{padding:10px;margin:8px}.el-dialog{border:2px solid #117c70;padding:24px;max-width:600px}li{padding:10px;cursor:pointer}.selected{background:#d4f5eb}#player{display:block;padding:40px;background:#dce8e5}</style>
<h1>课程助手模拟页</h1><button id="player" role="region" aria-label="video player">播放器</button><p id="clicks">播放点击：0</p>
<button onclick="showQuiz('single')">单选题</button><button onclick="showQuiz('multi')">多选题</button><button onclick="showQuiz('judgement')">判断题</button>
<script>
window.playerClicks=0;document.querySelector('#player').onclick=()=>{document.querySelector('#clicks').textContent='播放点击：'+(++window.playerClicks)};
window.showQuiz=(type='single',selected=[])=>{document.querySelectorAll('.el-dialog').forEach(x=>x.remove());const multi=type==='multi';const d=document.createElement('section');d.className='el-dialog';d.setAttribute('role','dialog');d.setAttribute('aria-label','弹题测验');d.innerHTML='<h2>弹题测验</h2><p>弹题是为了巩固知识，不影响作业考试成绩。</p><p class="stem">【'+(multi?'多选题':type==='judgement'?'判断题':'单选题')+'】'+(multi?'下列哪些数是偶数？':'1+1=2。')+'</p><ul class="options">'+(multi?['2','3','4']:['对','错']).map((text,i)=>'<li role="'+(multi?'checkbox':'radio')+'" aria-checked="'+selected.includes(i)+'" class="'+(selected.includes(i)?'selected':'')+'"><span>'+String.fromCharCode(65+i)+'.</span> '+text+'</li>').join('')+'</ul>'+(multi?'<button class="submit">提交答案</button>':'')+'<p class="result"></p><button class="close">关闭</button>';document.body.append(d);d.querySelector('.close').onclick=()=>d.remove();d.querySelectorAll('li').forEach((li,i)=>li.onclick=()=>{if(d.querySelector('.result').textContent)return;if(!multi)d.querySelectorAll('li').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-checked','false')});const is=li.getAttribute('aria-checked')==='true';li.setAttribute('aria-checked',String(!is));li.classList.toggle('selected',!is);if(!multi)d.querySelector('.result').textContent=i===0?'正确 正确答案：A':'错误 正确答案：A'});if(multi)d.querySelector('.submit').onclick=()=>{const vals=[...d.querySelectorAll('li')].map((x,i)=>x.getAttribute('aria-checked')==='true'?i:-1).filter(i=>i>=0);d.querySelector('.result').textContent=JSON.stringify(vals)==='[0,2]'?'正确 正确答案：A,C':'错误 正确答案：A,C'};};
</script></html>
